[package]
name = "foxhole"
version = "0.2.0"
edition = "2024"
default-run = "foxhole"

[[bin]]
name = "foxhole"
path = "src/main.rs"

[[bin]]
name = "foxhole-agent"
path = "guest-agent/src/main.rs"
test = true

[[bin]]
name = "foxhole-analyze"
path = "src/bin/foxhole_analyze.rs"

[dependencies]
walkdir = "2.5.0"
clap = { version = "4.5.38", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
reqwest = { version = "0.13.2", features = ["multipart", "stream"] }
tokio = { version = "1.45.0", features = ["fs", "macros", "rt-multi-thread", "time"] }
once_cell = "1.21.3"
ctrlc = "3.4.7"
dialoguer = "0.12.0"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.1", features = ["fs", "sched", "user"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.0", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_Isolation", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_ErrorReporting", "Win32_System_JobObjects", "Win32_System_Com", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_StationsAndDesktops", "Win32_System_Rpc", "Win32_System_Services", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_NetManagement", "Win32_NetworkManagement_WindowsFirewall", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Networking_WinSock", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell"] }
